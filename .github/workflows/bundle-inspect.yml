name: Inspect Cronometer bundle

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[bundle-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Inspect current Cronometer bundle
        run: uv run python scripts/inspect_cronometer_bundle.py > bundle-inspect.txt
      - name: Capture current Cronometer cache bundle
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          import httpx

          nocache = httpx.get(
              "https://cronometer.com/cronometer/cronometer.nocache.js",
              timeout=30,
              follow_redirects=True,
          )
          nocache.raise_for_status()
          permutations = list(
              dict.fromkeys(re.findall(r"='([A-F0-9]{32})'", nocache.text))
          )
          for permutation in permutations:
              response = httpx.get(
                  f"https://cronometer.com/cronometer/{permutation}.cache.js",
                  timeout=30,
                  follow_redirects=True,
              )
              if response.status_code == 200 and "MacroTargetTemplate" in response.text:
                  Path("cronometer.cache.js").write_text(response.text, encoding="utf-8")
                  print(permutation, len(response.text))
                  break
          else:
              raise RuntimeError("No current Cronometer cache bundle found")
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronometer-bundle-inspect
          path: |
            bundle-inspect.txt
            cronometer.cache.js
          if-no-files-found: error
          retention-days: 1
