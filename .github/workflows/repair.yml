name: Apply regression repairs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility repairs
        run: python scripts/repair_regressions.py
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cronometer_api_mcp/server.py src/cronometer_api_mcp/mobile_write_fixes.py tests/test_client.py scripts/live_mcp_probe.py
          git commit -m "Add macro payload variants and probe cleanup"
          git push origin HEAD:main
