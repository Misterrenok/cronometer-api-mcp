name: Live MCP probe

on:
  push:
    branches: [main]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[live-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Probe deployed MCP
        run: uv run python scripts/live_mcp_probe.py
