name: Inspect Cronometer bundle

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[bundle-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Inspect DiaryGroup implementation
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          import httpx

          base = "https://cronometer.com/cronometer/"
          nocache = httpx.get(base + "cronometer.nocache.js", timeout=30, follow_redirects=True)
          nocache.raise_for_status()
          permutations = list(dict.fromkeys(re.findall(r"='([A-F0-9]{32})'", nocache.text)))
          main = None
          permutation = None
          strong = None
          for candidate in permutations:
              response = httpx.get(base + candidate + ".cache.js", timeout=30, follow_redirects=True)
              if response.status_code == 200 and "DiaryGroup" in response.text and "RepeatItem" in response.text:
                  main = response.text
                  permutation = candidate
                  match = re.search(r"\$strongName = '([A-F0-9]{32})'", main)
                  strong = match.group(1) if match else None
                  break
          if main is None:
              raise RuntimeError("main Cronometer bundle missing")

          needles = [
              "function dHi", "dHi(", "new dHi", "function bHi", "bHi()",
              "aHi=", "DiaryGroup", "getDiaryGroup", "getDiaryGroups",
              "Uncategorized", "Breakfast", "Lunch", "Dinner", "Snacks",
          ]
          report = [f"permutation={permutation}", f"strongName={strong}", f"main_size={len(main)}"]
          for needle in needles:
              hits = list(re.finditer(re.escape(needle), main))
              report.append(f"\n### {needle} hits={len(hits)}")
              for match in hits[:50]:
                  lo = max(0, match.start() - 7000)
                  hi = min(len(main), match.end() + 9000)
                  report.append(f"\n--- pos={match.start()} ---\n{main[lo:hi]}\n--- END ---")

          # Also inspect deferred fragments when they mention DiaryGroup or RepeatItem.
          deferred_hits = 0
          if strong:
              for fragment in range(0, 250):
                  response = httpx.get(
                      f"{base}deferredjs/{strong}/{fragment}.cache.js",
                      timeout=5,
                      follow_redirects=True,
                  )
                  if response.status_code != 200:
                      continue
                  text = response.text
                  if "DiaryGroup" not in text and "RepeatItem" not in text:
                      continue
                  deferred_hits += 1
                  report.append(f"\n## FRAGMENT {fragment} size={len(text)}")
                  for needle in ("DiaryGroup", "RepeatItem", "Breakfast", "Lunch", "Dinner", "Snacks"):
                      for match in list(re.finditer(re.escape(needle), text))[:30]:
                          lo = max(0, match.start() - 7000)
                          hi = min(len(text), match.end() + 9000)
                          report.append(f"\n--- {needle} pos={match.start()} ---\n{text[lo:hi]}\n--- END ---")
          report.append(f"\ndeferred_hits={deferred_hits}")
          Path("diary-group-report.txt").write_text("\n".join(report), encoding="utf-8")
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronometer-diary-group-inspect
          path: diary-group-report.txt
          if-no-files-found: error
          retention-days: 1
