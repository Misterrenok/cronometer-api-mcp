name: Inspect Cronometer bundle

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[bundle-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Inspect current Cronometer bundle
        run: uv run python scripts/inspect_cronometer_bundle.py > bundle-inspect.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronometer-bundle-inspect
          path: bundle-inspect.txt
          if-no-files-found: error
