name: Inspect Cronometer bundle

on:
  push:
    branches: [main]

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[bundle-inspect]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Capture DiaryGroup implementation bundles
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          import httpx

          base = "https://cronometer.com/cronometer/"
          out = Path("bundle-capture")
          out.mkdir(exist_ok=True)
          nocache = httpx.get(base + "cronometer.nocache.js", timeout=30, follow_redirects=True)
          nocache.raise_for_status()
          permutations = list(dict.fromkeys(re.findall(r"='([A-F0-9]{32})'", nocache.text)))
          main = None
          permutation = None
          strong = None
          for candidate in permutations:
              response = httpx.get(base + candidate + ".cache.js", timeout=30, follow_redirects=True)
              if response.status_code == 200 and "DiaryGroup" in response.text and "RepeatItem" in response.text:
                  main = response.text
                  permutation = candidate
                  match = re.search(r"\$strongName = '([A-F0-9]{32})'", main)
                  strong = match.group(1) if match else candidate
                  break
          if main is None:
              raise RuntimeError("main Cronometer bundle missing")

          (out / "main.cache.js").write_text(main, encoding="utf-8")
          (out / "metadata.txt").write_text(
              f"permutation={permutation}\nstrongName={strong}\nmain_size={len(main)}\n",
              encoding="utf-8",
          )

          saved = []
          for fragment in range(0, 250):
              response = httpx.get(
                  f"{base}deferredjs/{strong}/{fragment}.cache.js",
                  timeout=5,
                  follow_redirects=True,
              )
              if response.status_code != 200:
                  continue
              text = response.text
              if any(term in text for term in ("DiaryGroup", "RepeatItem", "Breakfast", "Lunch", "Dinner", "Snacks")):
                  (out / f"fragment-{fragment}.cache.js").write_text(text, encoding="utf-8")
                  saved.append((fragment, len(text)))
          with (out / "metadata.txt").open("a", encoding="utf-8") as fh:
              for fragment, size in saved:
                  fh.write(f"fragment={fragment} size={size}\n")
          PY
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronometer-diary-group-bundles
          path: bundle-capture
          if-no-files-found: error
          retention-days: 1
