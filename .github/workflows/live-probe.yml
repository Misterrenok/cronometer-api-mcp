name: Live MCP probe

on:
  push:
    branches: [main]

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[live-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Probe deployed MCP
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/live_mcp_probe.py | tee live-probe.txt
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mcp-probe
          path: live-probe.txt
          if-no-files-found: warn
          retention-days: 1
